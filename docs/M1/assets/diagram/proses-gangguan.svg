@startuml

skinparam backgroundColor White
skinparam shadowing false
skinparam defaultFontColor Black
skinparam ArrowColor Black

skinparam activity {
    BackgroundColor White
    BorderColor Black
    FontColor Black
    DiamondBackgroundColor White
    DiamondBorderColor Black
    DiamondFontColor Black
    StartColor Black
    EndColor Black
    BarColor Black
}

title Proses Pelaporan dan Penanganan Gangguan

|#White|Warga|
start

:Menemukan gangguan
infrastruktur;

:Mengakses menu
pelaporan gangguan;

:Mengisi detail
gangguan;

:Mengirim laporan;

|#White|Sistem|
:Menyimpan laporan
gangguan;

:Mencatat status laporan
sebagai "Menunggu";

:Menyediakan laporan
kepada petugas operasional;

|#White|Petugas Operasional|
:Menerima laporan
gangguan;

:Memeriksa detail
laporan;

:Memeriksa kondisi
infrastruktur di lapangan;

:Memperbarui status menjadi
"Sedang Diperbaiki";

|#White|Sistem|
:Menyimpan perubahan
status laporan;

:Menampilkan status terbaru
kepada warga;

|#White|Warga|
:Melihat perkembangan
status laporan;

|#White|Petugas Operasional|
:Melakukan perbaikan
infrastruktur;

:Mencatat aktivitas
pemeliharaan atau perbaikan;

:Memperbarui status menjadi
"Selesai";

|#White|Sistem|
:Menyimpan riwayat
pemeliharaan;

:Menyimpan status akhir
laporan;

:Menampilkan status
"Selesai" kepada warga;

|#White|Warga|
:Melihat laporan
telah selesai;

stop

@enduml

