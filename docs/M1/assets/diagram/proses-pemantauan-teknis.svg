@startuml

skinparam backgroundColor White
skinparam shadowing false
skinparam defaultFontColor Black
skinparam ArrowColor Black

skinparam ConditionEndStyle hline

skinparam activity {
    BackgroundColor White
    BorderColor Black
    FontColor Black
    DiamondBackgroundColor White
    DiamondBorderColor Black
    DiamondFontColor Black
    StartColor Black
    EndColor Black
    BarColor Black
}

title Proses Pemantauan Teknis dan Peringatan Dini

|#White|Petugas Operasional|
start

:Mengakses halaman
pemantauan teknis;

|#White|Sistem|
:Menerima data kondisi
panel surya dan baterai;

:Memperbarui data
kinerja perangkat;

:Menampilkan grafik
efisiensi panel surya;

|#White|Petugas Operasional|
:Memantau perubahan
efisiensi perangkat;

|#White|Sistem|
if (Daya baterai di bawah batas aman?) then (Ya)

    :Mengirim peringatan
    daya kritis;

    |#White|Petugas Operasional|
    :Menerima peringatan;

    :Memeriksa kondisi
    perangkat;

    :Melakukan tindakan
    preventif;

else (Tidak)

    |#White|Petugas Operasional|

endif

:Melanjutkan pemantauan
teknis;

stop

@enduml

