<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="900" height="620" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#000"/>
    </marker>
  </defs>

  <!-- batas sistem -->
  <rect x="230" y="10" width="440" height="600" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="450" y="38" text-anchor="middle">Sistem Fajar Tech</text>

  <!-- lapisan -->
  <rect x="260" y="60" width="380" height="90" fill="#fff" stroke="#000"/>
  <text x="450" y="92" text-anchor="middle">View</text>
  <text x="450" y="118" text-anchor="middle" font-size="12">WargaView, TeknisiView, PengurusView, AuthView</text>

  <rect x="260" y="190" width="380" height="90" fill="#fff" stroke="#000"/>
  <text x="450" y="222" text-anchor="middle">Controller</text>
  <text x="450" y="248" text-anchor="middle" font-size="12">Akun, Laporan, Pemeliharaan, Iuran, Monitoring, Telemetri</text>

  <rect x="260" y="320" width="380" height="90" fill="#fff" stroke="#000"/>
  <text x="450" y="352" text-anchor="middle">Modul</text>
  <text x="450" y="378" text-anchor="middle" font-size="12">Akun, Laporan, Pemeliharaan, Iuran, Monitoring, Notifikasi</text>

  <rect x="260" y="450" width="380" height="90" fill="#fff" stroke="#000"/>
  <text x="450" y="482" text-anchor="middle">Boundary Data</text>
  <text x="450" y="508" text-anchor="middle" font-size="12">Akun, Laporan, Perangkat, Iuran (Prisma)</text>

  <line x1="450" y1="150" x2="450" y2="190" stroke="#000" marker-end="url(#a)"/>
  <line x1="450" y1="280" x2="450" y2="320" stroke="#000" marker-end="url(#a)"/>
  <line x1="450" y1="410" x2="450" y2="450" stroke="#000" marker-end="url(#a)"/>

  <!-- aktor kiri -->
  <g stroke="#000" fill="none" stroke-width="1.5">
    <g id="orang">
      <circle cx="90" cy="70" r="9"/>
      <path d="M90 79V108M70 90H110M90 108 74 130M90 108 106 130"/>
    </g>
    <use href="#orang" y="120"/>
    <use href="#orang" y="240"/>
  </g>
  <text x="90" y="152" text-anchor="middle">Warga</text>
  <text x="90" y="272" text-anchor="middle">Teknisi</text>
  <text x="90" y="392" text-anchor="middle">Pengurus</text>
  <line x1="115" y1="90" x2="260" y2="100" stroke="#000" marker-end="url(#a)"/>
  <line x1="115" y1="210" x2="260" y2="110" stroke="#000" marker-end="url(#a)"/>
  <line x1="115" y1="330" x2="260" y2="125" stroke="#000" marker-end="url(#a)"/>
  <text x="90" y="430" text-anchor="middle" font-size="12">Browser (HTTPS)</text>

  <!-- sistem eksternal -->
  <rect x="720" y="170" width="160" height="70" fill="#fff" stroke="#000"/>
  <text x="800" y="196" text-anchor="middle">Perangkat Lapangan</text>
  <text x="800" y="216" text-anchor="middle" font-size="12">(simulator SensorAdapter)</text>
  <line x1="720" y1="215" x2="640" y2="235" stroke="#000" marker-end="url(#a)"/>
  <text x="680" y="208" text-anchor="middle" font-size="12" font-style="italic">telemetri</text>

  <rect x="720" y="300" width="160" height="70" fill="#fff" stroke="#000"/>
  <text x="800" y="326" text-anchor="middle">Gateway Notifikasi</text>
  <text x="800" y="346" text-anchor="middle" font-size="12">(disimulasikan)</text>
  <line x1="640" y1="355" x2="720" y2="340" stroke="#000" marker-end="url(#a)"/>
  <text x="680" y="332" text-anchor="middle" font-size="12" font-style="italic">peringatan</text>

  <rect x="720" y="470" width="160" height="70" fill="#fff" stroke="#000"/>
  <text x="800" y="496" text-anchor="middle">Basis Data</text>
  <text x="800" y="516" text-anchor="middle" font-size="12">PostgreSQL</text>
  <line x1="640" y1="505" x2="720" y2="505" stroke="#000" marker-start="url(#a)" marker-end="url(#a)"/>
</svg>
